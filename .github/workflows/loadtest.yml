name: Load Test + HPA Autoscaling (k6)

# Déclenchement MANUEL depuis l'onglet Actions (on ne veut pas charger le cluster à chaque push)
on:
  workflow_dispatch: {}

jobs:
  loadtest:
    # Tourne sur le self-hosted runner installé sur le master (accès réseau privé + microk8s)
    runs-on: self-hosted
    steps:
      - name: Récupérer le code (manifeste k6)
        uses: actions/checkout@v4

      - name: État AVANT la charge
        run: |
          echo "===== HPA + pods AVANT charge ====="
          microk8s kubectl -n coco get hpa covoiturage-service
          microk8s kubectl -n coco get pods -l app=covoiturage-service

      - name: Lancer le test de charge k6 (Job in-cluster)
        run: |
          microk8s kubectl -n coco delete job k6-loadtest --ignore-not-found
          microk8s kubectl apply -f loadtest/k6-job.yaml

      - name: Observer l'autoscaling (scale UP)
        run: |
          echo "===== k6 charge covoiturage EN DIRECT -> l'HPA doit ajouter des pods ====="
          for i in $(seq 1 12); do
            sleep 15
            PODS=$(microk8s kubectl -n coco get pods -l app=covoiturage-service --no-headers | wc -l)
            HPA=$(microk8s kubectl -n coco get hpa covoiturage-service --no-headers)
            echo "t+$((i*15))s | pods=$PODS | HPA: $HPA"
          done

      - name: Résultats k6
        run: microk8s kubectl -n coco logs job/k6-loadtest | tail -30

      - name: Observer le retour au calme (scale DOWN)
        run: |
          echo "===== Trafic arrêté : l'HPA va réduire les pods ====="
          for i in $(seq 1 9); do
            sleep 20
            PODS=$(microk8s kubectl -n coco get pods -l app=covoiturage-service --no-headers | wc -l)
            HPA=$(microk8s kubectl -n coco get hpa covoiturage-service --no-headers)
            echo "scale-down t+$((i*20))s | pods=$PODS | HPA: $HPA"
          done

      - name: État APRÈS + nettoyage du Job
        if: always()
        run: |
          microk8s kubectl -n coco get hpa covoiturage-service
          microk8s kubectl -n coco get pods -l app=covoiturage-service
          microk8s kubectl -n coco delete job k6-loadtest --ignore-not-found
